name: Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  validate-version:
    name: Verify release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Validate requested tag
        id: requested
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag) is None:
              raise SystemExit("release tag must be vMAJOR.MINOR.PATCH")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
          PY
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.requested.outputs.tag }}
      - id: version
        env:
          RELEASE_TAG: ${{ steps.requested.outputs.tag }}
        run: |
          GITHUB_REF_NAME="$RELEASE_TAG" python3 .github/scripts/check-release-version.py
          sha=$(git rev-parse --verify 'HEAD^{commit}')
          printf 'tag=%s\nsha=%s\n' "$RELEASE_TAG" "$sha" >> "$GITHUB_OUTPUT"

  check-linux:
    needs: validate-version
    uses: ./.github/workflows/ci-linux.yml
    with:
      checkout_ref: ${{ needs.validate-version.outputs.sha }}

  check-macos:
    needs: validate-version
    uses: ./.github/workflows/ci-macos.yml
    with:
      checkout_ref: ${{ needs.validate-version.outputs.sha }}

  check-windows:
    needs: validate-version
    uses: ./.github/workflows/ci-windows.yml
    with:
      checkout_ref: ${{ needs.validate-version.outputs.sha }}

  check-security:
    needs: validate-version
    uses: ./.github/workflows/security-audit.yml
    with:
      checkout_ref: ${{ needs.validate-version.outputs.sha }}

  publish-crate:
    name: Publish to crates.io
    needs: [validate-version, check-linux, check-macos, check-windows, check-security]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Stage registry verification tool
        run: cp .github/scripts/check-registry-version.py "$RUNNER_TEMP/hpip-check-registry-version.py"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-version.outputs.sha }}
      - uses: ./.github/actions/build-environment
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - name: Package crate
        run: cargo +1.99.0 package --locked
      - name: Check existing crate version
        id: published
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: python3 "$RUNNER_TEMP/hpip-check-registry-version.py" "$RELEASE_VERSION"
      - name: Publish crate
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo +1.99.0 publish --locked

  create-release:
    name: Create GitHub Release
    needs: [validate-version, check-linux, check-macos, check-windows, publish-crate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-version.outputs.sha }}
      - name: Download validated binaries
        uses: actions/download-artifact@v8
        with:
          pattern: hpip-*
          path: artifacts
      - name: Package binaries and checksums
        run: python3 .github/scripts/package-release.py
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          target_commitish: ${{ needs.validate-version.outputs.sha }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: release/*

name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  validate-version:
    name: Verify release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: python3 .github/scripts/check-release-version.py

  check-linux:
    needs: validate-version
    uses: ./.github/workflows/ci-linux.yml

  check-macos:
    needs: validate-version
    uses: ./.github/workflows/ci-macos.yml

  check-windows:
    needs: validate-version
    uses: ./.github/workflows/ci-windows.yml

  publish-crate:
    name: Publish to crates.io
    needs: [validate-version, check-linux, check-macos, check-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - name: Package crate
        run: cargo +1.99.0 package --locked
      - name: Check existing crate version
        id: published
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          status=$(curl --retry 3 -sS -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/hpip/$RELEASE_VERSION")
          case "$status" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io response: $status" >&2; exit 1 ;;
          esac
      - name: Publish crate
        if: steps.published.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo +1.99.0 publish --locked

  create-release:
    name: Create GitHub Release
    needs: [validate-version, check-linux, check-macos, check-windows, publish-crate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download validated binaries
        uses: actions/download-artifact@v8
        with:
          pattern: hpip-*
          path: artifacts
      - name: Package binaries and checksums
        run: python3 .github/scripts/package-release.py
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: release/*

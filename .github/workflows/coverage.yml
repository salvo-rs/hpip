name: Coverage

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "assets/**"
      - ".github/**"

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-environment
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Install cargo-tarpaulin
        run: cargo +1.99.0 install --locked cargo-tarpaulin

      - name: Generate coverage
        run: cargo +1.99.0 tarpaulin --locked --out xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          file: cobertura.xml

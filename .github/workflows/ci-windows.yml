name: ci-windows

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Immutable source revision supplied by a release workflow
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "assets/**"
      - "install.*"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "assets/**"
      - "install.*"
      - ".github/**"

jobs:
  test:
    name: Rust 1.99 checks - x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: ./.github/actions/build-environment
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy
      - name: Verify Cargo output directory
        shell: pwsh
        run: |
          $metadata = cargo +1.99.0 metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          foreach ($directory in @($metadata.target_directory, $metadata.build_directory)) {
            if (-not $directory) { continue }
            $actual = [IO.Path]::GetFullPath($directory).Replace('\', '/')
            if (-not $actual.StartsWith('D:/BuildCache/hpip-ci/', [StringComparison]::OrdinalIgnoreCase)) {
              throw "Cargo output must remain on D: $actual"
            }
          }
      - name: Check all targets
        run: cargo +1.99.0 check --locked --all-targets
      - name: Strict Clippy
        run: cargo +1.99.0 clippy --locked --all-targets -- -D warnings
      - name: Run tests
        timeout-minutes: 20
        run: cargo +1.99.0 test --locked --all-targets
      - name: Validate Windows installer
        shell: pwsh
        run: ./.github/scripts/test-install.ps1
      - name: Build release
        run: cargo +1.99.0 build --locked --release --target x86_64-pc-windows-msvc
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hpip-x86_64-pc-windows-msvc
          path: ${{ env.CARGO_TARGET_DIR }}/x86_64-pc-windows-msvc/release/hpip.exe
          if-no-files-found: error
